services:
  limnoria:
    image: lscr.io/linuxserver/limnoria:latest
    container_name: merlynbot

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels

    volumes:
      - ./config:/config

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped