name: Deploy MerlynBot

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      commit:
        description: "Git commit SHA to deploy"
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            --exclude='config/MerlynBot.pem' \
            --exclude='config/logs/' \
            --exclude='config/tmp/' \
            --exclude='config/backup/' \
            --exclude='config/data/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            merlynbot/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:~/merlynbot/"

      - name: Restart container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd ~/merlynbot && docker compose up -d --force-recreate --remove-orphans'

      - name: Check if bot is running after container restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'docker ps --filter name=merlynbot --format "table {{.Names}}\t{{.Status}}"'

          ssh -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'docker logs --tail 30 merlynbot'